    function renderRecordDialog() {
      const context = getRecordContext();
      if (!context) {
        closeRecordDialog();
        showToast("没有找到这笔记录", true);
        return false;
      }

      const { customer, sale } = context;
      const isOpen = sale.remaining > 0;
      recordError.hidden = true;

      if (recordMode === "edit") {
        if (!recordDraft) {
          recordDraft = {
            date: sale.date,
            item: sale.item,
            amountCents: sale.amountCents,
            paidCents: sale.paidCents
          };
        }
        recordDialogTitle.textContent = "修改这笔赊账";
        recordDialogSubtitle.textContent =
          customer.name + " · 保存前还会再确认一次";
        recordBody.innerHTML = renderRecordEditHtml(customer);
        recordActions.innerHTML =
          '<button class="secondary-button" type="button" data-record-action="cancel">取消</button>' +
          '<button class="primary-button" type="button" data-record-action="saveEdit">保存修改</button>';
      } else if (recordMode === "confirmEdit") {
        if (!recordDraft) {
          recordMode = "edit";
          renderRecordDialog();
          return;
        }
        recordDialogTitle.textContent = "确认修改";
        recordDialogSubtitle.textContent = customer.name + " · 最后确认一次";
        recordBody.innerHTML = renderRecordConfirmEditHtml();
        recordActions.innerHTML =
          '<button class="secondary-button" type="button" data-record-action="backToEdit">再想想</button>' +
          '<button class="primary-button" type="button" data-record-action="confirmEdit">确认修改</button>';
      } else if (recordMode === "confirmDelete") {
        recordDialogTitle.textContent = "确认删除";
        recordDialogSubtitle.textContent = customer.name + " · 删除后无法恢复";
        recordBody.innerHTML = renderRecordConfirmDeleteHtml(sale);
        recordActions.innerHTML =
          '<button class="secondary-button" type="button" data-record-action="cancel">取消</button>' +
          '<button class="danger-button solid" type="button" data-record-action="confirmDelete">确认删除</button>';
      } else {
        recordDialogTitle.textContent = "赊销详情";
        recordDialogSubtitle.textContent =
          customer.name + (isOpen ? " · 还有欠款" : " · 已结清");
        recordBody.innerHTML = renderRecordDetailHtml(customer, sale);
        recordActions.innerHTML =
          '<button class="danger-button" type="button" data-record-action="delete">删除</button>' +
          '<button class="primary-button" type="button" data-record-action="edit">修改</button>';
      }

      recordBody.classList.remove("record-mode-enter");
      if (!prefersReducedMotion()) {
        void recordBody.offsetWidth;
        recordBody.classList.add("record-mode-enter");
      }
      recordBody.scrollTop = 0;
      return true;
    }

    function startRecordEdit() {
      const context = getRecordContext();
      if (!context) return;

      recordDraft = {
        date: context.sale.date,
        item: context.sale.item,
        amountCents: context.sale.amountCents,
        paidCents: context.sale.paidCents
      };
      recordMode = "edit";
      renderRecordDialog();
    }

    function startRecordDelete() {
      if (!getRecordContext()) return;
      recordMode = "confirmDelete";
      renderRecordDialog();
    }

    function cancelRecordMode() {
      recordMode = "view";
      recordDraft = null;
      renderRecordDialog();
    }

    function backToRecordEdit() {
      recordMode = "edit";
      renderRecordDialog();
    }

    function readRecordEditDraft() {
      const date = document.getElementById("recordEditDate").value;
      const item = document.getElementById("recordEditItem").value.trim();
      const amountCents = yuanToCents(
        document.getElementById("recordEditAmount").value
      );
      const paidCents = yuanToCents(
        document.getElementById("recordEditPaid").value
      );

      if (!item) {
        showRecordError("请填写配件名或备注。", "recordEditItem");
        return null;
      }
      if (!parseDateParts(date)) {
        showRecordError("请选择正确的日期。", "recordEditDate");
        return null;
      }
      if (date > todayString()) {
        showRecordError("日期不能晚于今天。", "recordEditDate");
        return null;
      }
      if (!Number.isFinite(amountCents) || amountCents <= 0) {
        showRecordError("请填写正确的金额，必须大于 0。", "recordEditAmount");
        return null;
      }
      if (!Number.isFinite(paidCents) || paidCents < 0) {
        showRecordError("请填写正确的已付金额。", "recordEditPaid");
        return null;
      }
      if (paidCents > amountCents) {
        showRecordError("记账时已付不能大于金额。", "recordEditPaid");
        return null;
      }

      if (
        wouldOverpay(
          recordCustomerId,
          data.sales.map((sale) =>
            sale.id === recordSaleId
              ? {
                  ...sale,
                  amountCents,
                  paidCents
                }
              : sale
          )
        )
      ) {
        showRecordError(
          "修改后，这位客户的历史收款会超过总欠款，不能保存。可以把金额改大一点，或把记账时已付改小一点。"
        );
        return null;
      }

      return {
        date,
        item,
        amountCents,
        paidCents
      };
    }

    function saveRecordEditDraft() {
      const draft = readRecordEditDraft();
      if (!draft) return;

      recordDraft = draft;
      recordMode = "confirmEdit";
      renderRecordDialog();
    }

    function applyRecordEdit() {
      if (recordActionBusy || !recordDraft) return;
      recordActionBusy = true;

      const draft = recordDraft;
      const nextSales = data.sales.map((sale) =>
        sale.id === recordSaleId
          ? {
              ...sale,
              date: draft.date,
              item: draft.item,
              amountCents: draft.amountCents,
              paidCents: draft.paidCents,
              updatedAt: new Date().toISOString()
            }
          : sale
      );

      if (wouldOverpay(recordCustomerId, nextSales)) {
        recordActionBusy = false;
        showRecordError(
          "修改后，这位客户的历史收款会超过总欠款，不能保存。"
        );
        return;
      }

      const editedSaleId = recordSaleId;
      const nextData = {
        ...data,
        sales: nextSales
      };

      if (!commitData(nextData)) {
        recordActionBusy = false;
        showRecordError(lastSaveError || "修改没有保存成功。");
        return;
      }

      closeRecordDialog();
      renderApp();

      const card = findSaleCardElement(editedSaleId);
      if (card && !prefersReducedMotion()) {
        card.classList.add("item-updated");
        setTimeout(() => card.classList.remove("item-updated"), 800);
      }
      showToast("记录已修改");
    }

    function performDeleteSale(saleId, customerId, card) {
      const nextSales = data.sales.filter((sale) => sale.id !== saleId);
      const nextCustomers = data.customers.filter((customer) => {
        if (customer.id !== customerId) return true;
        const stillHasSales = nextSales.some(
          (sale) => sale.customerId === customerId
        );
        const stillHasPayments = (data.payments || []).some(
          (payment) => payment.customerId === customerId
        );
        return stillHasSales || stillHasPayments;
      });

      const nextData = {
        ...data,
        customers: nextCustomers,
        sales: nextSales
      };

      if (!commitData(nextData)) {
        if (card) card.classList.remove("item-leaving");
        showToast(lastSaveError || "删除失败，记录还在", true);
        return;
      }

      if (currentCustomerId === customerId) {
        const customerStillExists = nextCustomers.some(
          (customer) => customer.id === customerId
        );
        if (!customerStillExists) {
          showHome();
        } else {
          renderApp();
        }
      } else {
        renderApp();
      }
      showToast("记录已删除");
    }

    function confirmRecordDelete() {
      if (recordActionBusy || !recordCustomerId) return;

      const context = getRecordContext();
      if (!context) return;

      const nextSales = data.sales.filter(
        (sale) => sale.id !== recordSaleId
      );
      if (wouldOverpay(recordCustomerId, nextSales)) {
        showRecordError(
          "删除后，这位客户的历史收款会超过剩余欠款，所以不能删除。这笔记录可能已经有后续收款了。"
        );
        return;
      }

      const saleId = recordSaleId;
      const customerId = recordCustomerId;
      const card = findSaleCardElement(saleId);
      recordActionBusy = true;
      closeRecordDialog();

      if (!card || prefersReducedMotion()) {
        performDeleteSale(saleId, customerId, card);
        return;
      }

      card.classList.add("item-leaving");
      setTimeout(() => {
        performDeleteSale(saleId, customerId, card);
      }, 260);
    }

    // ---------- 导出与恢复 ----------
    function exportBackup() {
      const payload = {
        ...data,
        app: APP_NAME,
        version: APP_VERSION,
        exportedAt: new Date().toISOString()
      };

      const json = JSON.stringify(payload, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = "云岸笔记备份-" + todayString() + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);

      showToast("备份文件已导出");
    }

    function readBackupText(expected) {
      if (!expected || typeof expected !== "string") {
        throw new Error("备份内容不完整");
      }
      return expected.trim();
    }

    function parseBackup(text) {
      let raw;
      try {
        raw = JSON.parse(text);
      } catch (error) {
        throw new Error("文件不是有效的 JSON 备份");
      }

      if (!raw || !isKnownAppName(raw.app)) {
        throw new Error("这不是云岸笔记导出的备份文件");
      }
      if (raw.version !== 1 && raw.version !== APP_VERSION) {
        throw new Error("备份版本不支持，请换成本工具的备份文件");
      }
      if (!Array.isArray(raw.customers) || !Array.isArray(raw.sales)) {
        throw new Error("备份缺少客户或赊销记录");
      }

      const rawPayments = raw.version === 1 ? [] : raw.payments;
      if (!Array.isArray(rawPayments)) {
        throw new Error("备份的收款记录格式不正确");
      }

      const customerIds = new Set();
      const customerNames = new Set();
      const customers = raw.customers.map((item, index) => {
        const row = index + 1;
        if (!item || typeof item !== "object") {
          throw new Error("第 " + row + " 位客户格式不正确");
        }

        const id = readBackupText(item.id);
        const name = readBackupText(item.name);
        if (!id || id.length > 100 || id === "__new__") {
          throw new Error("第 " + row + " 位客户的编号不正确");
        }
        if (!name || name.length > 20) {
          throw new Error("第 " + row + " 位客户的名字不正确");
        }
        if (customerIds.has(id)) {
          throw new Error("备份里有重复的客户编号");
        }
        if (customerNames.has(name.toLowerCase())) {
          throw new Error("备份里有重复的客户名字：" + name);
        }

        customerIds.add(id);
        customerNames.add(name.toLowerCase());

        return {
          id,
          name,
          createdAt:
            typeof item.createdAt === "string"
              ? item.createdAt
              : new Date().toISOString()
        };
      });

      const saleIds = new Set();
      const sales = raw.sales.map((item, index) => {
        const row = index + 1;
        if (!item || typeof item !== "object") {
          throw new Error("第 " + row + " 笔记录格式不正确");
        }

        const id = readBackupText(item.id);
        const customerId = readBackupText(item.customerId);
        const itemName = readBackupText(item.item);
        const date = readBackupText(item.date);

        if (!id || id.length > 100 || saleIds.has(id)) {
          throw new Error("第 " + row + " 笔记录的编号不正确");
        }
        if (!customerIds.has(customerId)) {
          throw new Error("第 " + row + " 笔记录找不到对应客户");
        }
        if (!itemName || itemName.length > 40) {
          throw new Error("第 " + row + " 笔记录的配件名不正确");
        }
        if (!parseDateParts(date)) {
          throw new Error("第 " + row + " 笔记录的日期不正确");
        }
        if (
          !Number.isSafeInteger(item.amountCents) ||
          item.amountCents <= 0
        ) {
          throw new Error("第 " + row + " 笔记录的金额不正确");
        }
        if (
          !Number.isSafeInteger(item.paidCents) ||
          item.paidCents < 0 ||
          item.paidCents > item.amountCents
        ) {
          throw new Error("第 " + row + " 笔记录的已付金额不正确");
        }

        saleIds.add(id);
        return {
          id,
          customerId,
          date,
          item: itemName,
          amountCents: item.amountCents,
          paidCents: item.paidCents,
          createdAt:
            typeof item.createdAt === "string"
              ? item.createdAt
              : new Date().toISOString()
        };
      });

      const paymentIds = new Set();
      const payments = rawPayments.map((item, index) => {
        const row = index + 1;
        if (!item || typeof item !== "object") {
          throw new Error("第 " + row + " 笔收款记录格式不正确");
        }

        const id = readBackupText(item.id);
        const customerId = readBackupText(item.customerId);
        const date = readBackupText(item.date);
        const amountCents = item.amountCents;
        const writeOffCents = item.writeOffCents;

        if (!id || id.length > 100 || paymentIds.has(id)) {
          throw new Error("第 " + row + " 笔收款记录的编号不正确");
        }
        if (!customerIds.has(customerId)) {
          throw new Error("第 " + row + " 笔收款记录找不到对应客户");
        }
        if (!parseDateParts(date)) {
          throw new Error("第 " + row + " 笔收款记录的日期不正确");
        }
        if (
          !Number.isSafeInteger(amountCents) ||
          amountCents < 0
        ) {
          throw new Error("第 " + row + " 笔收款记录的金额不正确");
        }
        if (
          !Number.isSafeInteger(writeOffCents) ||
          writeOffCents < 0
        ) {
          throw new Error("第 " + row + " 笔收款记录的抹零金额不正确");
        }
        if (amountCents + writeOffCents <= 0) {
          throw new Error("第 " + row + " 笔收款记录没有金额");
        }

        paymentIds.add(id);
        return {
          id,
          customerId,
          date,
          amountCents,
          writeOffCents,
          createdAt:
            typeof item.createdAt === "string"
              ? item.createdAt
              : new Date().toISOString()
        };
      });

      // 防止导入的收款总额超过原始欠款，避免账目越算越乱。
      const originalDebtByCustomer = new Map();
      const customerNameById = new Map();
      for (const customer of customers) {
        customerNameById.set(customer.id, customer.name);
      }
      for (const sale of sales) {
        originalDebtByCustomer.set(
          sale.customerId,
          (originalDebtByCustomer.get(sale.customerId) || 0) +
            (sale.amountCents - sale.paidCents)
        );
      }

      const reductionByCustomer = new Map();
      for (const payment of payments) {
        reductionByCustomer.set(
          payment.customerId,
          (reductionByCustomer.get(payment.customerId) || 0) +
            payment.amountCents +
            payment.writeOffCents
        );
      }

      for (const [customerId, reduction] of reductionByCustomer) {
        const originalDebt = originalDebtByCustomer.get(customerId) || 0;
        if (reduction > originalDebt) {
          throw new Error(
            "客户“" +
              customerNameById.get(customerId) +
              "”的收款记录超过了欠款总额"
          );
        }
      }

      return {
        app: APP_NAME,
        version: APP_VERSION,
        customers,
        sales,
        payments
      };
    }

    async function importBackupFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        const imported = parseBackup(text);
        const currentCount =
          data.customers.length +
          " 位客户、" +
          data.sales.length +
          " 笔赊账、" +
          (data.payments || []).length +
          " 笔收款";
        const importedCount =
          imported.customers.length +
          " 位客户、" +
          imported.sales.length +
          " 笔赊账、" +
          imported.payments.length +
          " 笔收款";

        const sure = window.confirm(
          "导入会覆盖当前全部数据。\n\n当前：" +
            currentCount +
            "\n将导入：" +
            importedCount +
            "\n\n确定恢复吗？"
        );
        if (!sure) return;

        if (!commitData(imported)) {
          showToast(lastSaveError || "数据没有恢复成功", true);
          return;
        }
        showHome();
        showToast("数据已恢复");
      } catch (error) {
        console.error("导入失败：", error);
        window.alert("恢复失败：" + error.message);
      } finally {
        importInput.value = "";
      }
    }

    // ---------- 提示 ----------
    function showToast(message, isError = false) {
      clearTimeout(toastTimer);
      clearTimeout(toastHideTimer);

      toastEl.textContent = message;
      toastEl.classList.toggle("error", isError);
      toastEl.hidden = false;

      requestAnimationFrame(() => {
        toastEl.classList.add("visible");
      });

      toastTimer = setTimeout(() => {
        toastEl.classList.remove("visible");
        toastHideTimer = setTimeout(() => {
          toastEl.hidden = true;
        }, 200);
      }, 2600);
    }

    // ---------- 事件绑定 ----------
    const RIPPLE_SELECTOR =
      ".primary-button, .pay-button, .secondary-button, .danger-button, .back-button, .dialog-close, .customer-card, .settled-card, .sale-card, .sort-toggle";

    document.addEventListener("pointerdown", (event) => {
      if (event.button !== 0 || prefersReducedMotion()) return;

      const target = event.target.closest(RIPPLE_SELECTOR);
      if (!target || target.disabled) return;

      const rect = target.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 1.7;
      const ripple = document.createElement("span");

      ripple.className = "tap-ripple";
      ripple.style.width = size + "px";
      ripple.style.height = size + "px";
      ripple.style.left = event.clientX - rect.left + "px";
      ripple.style.top = event.clientY - rect.top + "px";
      target.appendChild(ripple);
      ripple.addEventListener("animationend", () => ripple.remove(), {
        once: true
      });

      const vibration = target.matches(".primary-button, .pay-button")
        ? 8
        : target.matches(".sort-toggle, .danger-button")
          ? 5
          : 0;

      if (vibration && typeof navigator.vibrate === "function") {
        try {
          navigator.vibrate(vibration);
        } catch (error) {
          // 不支持轻震动的浏览器直接忽略。
        }
      }
    });

    mainEl.addEventListener("click", (event) => {
      if (event.target.closest("#sortButton")) {
        toggleSortMode();
        return;
      }

      const saleCard = event.target.closest("[data-sale-id]");
      if (saleCard) {
        openRecordDialog(saleCard.dataset.saleId);
        return;
      }

      const card = event.target.closest("[data-customer-id]");
      if (card) {
        openLedger(card.dataset.customerId);
      }
    });

    mainEl.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;

      const saleCard = event.target.closest("[data-sale-id]");
      if (!saleCard) return;

      event.preventDefault();
      openRecordDialog(saleCard.dataset.saleId);
    });

    backButton.addEventListener("click", showHome);
    addButton.addEventListener("click", openSaleDialog);
    paymentButton.addEventListener("click", openPaymentDialog);
    customerSelect.addEventListener("change", syncNewCustomerField);
    saleForm.addEventListener("submit", (event) => {
      try {
        handleSaleSubmit(event);
      } catch (error) {
        console.error("登记时出错：", error);
        showFormError("保存时出现异常，请刷新页面后确认是否已经记上。");
        saveButton.disabled = false;
      }
    });

    cancelButton.addEventListener("click", () => {
      saleDialog.close();
    });

    saleDialog.addEventListener("click", (event) => {
      if (event.target === saleDialog) {
        saleDialog.close();
      }
    });

    saleDialog.addEventListener("close", () => {
      document.body.classList.remove("dialog-open");
      formError.hidden = true;
    });

    paymentForm.addEventListener("submit", (event) => {
      try {
        handlePaymentSubmit(event);
      } catch (error) {
        console.error("收款时出错：", error);
        showPaymentError("保存时出现异常，请刷新页面后确认是否已经记上。");
        paymentSaveButton.disabled = false;
      }
    });

    paymentAmount.addEventListener("input", updatePaymentPreview);
    paymentWriteOff.addEventListener("input", updatePaymentPreview);

    paymentCancelButton.addEventListener("click", () => {
      paymentDialog.close();
    });

    paymentDialog.addEventListener("click", (event) => {
      if (event.target === paymentDialog) {
        paymentDialog.close();
      }
    });

    paymentDialog.addEventListener("close", () => {
      document.body.classList.remove("dialog-open");
      paymentError.hidden = true;
      currentPaymentCustomerId = null;
      currentPaymentBalance = 0;
    });

    recordCloseButton.addEventListener("click", closeRecordDialog);

    recordDialog.addEventListener("click", (event) => {
      const actionButton = event.target.closest("[data-record-action]");
      if (actionButton) {
        const action = actionButton.dataset.recordAction;
        if (action === "edit") startRecordEdit();
        else if (action === "delete") startRecordDelete();
        else if (action === "cancel") cancelRecordMode();
        else if (action === "backToEdit") backToRecordEdit();
        else if (action === "saveEdit") saveRecordEditDraft();
        else if (action === "confirmEdit") applyRecordEdit();
        else if (action === "confirmDelete") confirmRecordDelete();
        return;
      }

      if (event.target === recordDialog && recordMode === "view") {
        closeRecordDialog();
      }
    });

    recordDialog.addEventListener("cancel", (event) => {
      if (recordMode !== "view") {
        event.preventDefault();
      }
    });

    recordDialog.addEventListener("close", () => {
      document.body.classList.remove("dialog-open");
      recordError.hidden = true;
      recordMode = "view";
      recordDraft = null;
      recordSaleId = "";
      recordCustomerId = "";
      recordActionBusy = false;
    });

    exportButton.addEventListener("click", exportBackup);
    importButton.addEventListener("click", () => importInput.click());
    importInput.addEventListener("change", importBackupFile);

    // 首次进入
    if (!storageAvailable) {
      showStorageNotice();
    }
    renderApp();
    playViewEnter();
  </script>
</body>
</html>
